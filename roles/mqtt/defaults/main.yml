---
mqtt_enabled: true

# Preserve existing contract
mqtt_namespace: apps
mqtt_app_name: mqtt
mqtt_hostname: mqtt.lab.example.com
mqtt_ingress_enabled: false
mqtt_websocket_enabled: false

# Expanded contract
mqtt_image: eclipse-mosquitto:2
mqtt_replicas: 1

mqtt_service_port: 1883
mqtt_container_port: 1883

mqtt_websocket_port: 9001
mqtt_websocket_container_port: 9001

mqtt_ingress_class_name: traefik
mqtt_ingress_middlewares: []
mqtt_tls_enabled: false
mqtt_tls_cert_resolver: le

mqtt_persistence_enabled: true
mqtt_storage_class: ""
mqtt_storage_size: 1Gi

mqtt_config_path: /mosquitto/config/mosquitto.conf
mqtt_data_mount_path: /mosquitto/data
mqtt_log_mount_path: /mosquitto/log
