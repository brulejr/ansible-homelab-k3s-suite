---
- name: Install podman packages
  ansible.builtin.package:
    name:
      - podman
      - buildah
      - ca-certificates
      - git
    state: present

- name: Ensure runtime image work directory exists
  ansible.builtin.file:
    path: "{{ jekyll_runtime_image_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove previous runtime image checkout
  ansible.builtin.file:
    path: "{{ jekyll_runtime_image_work_dir }}/repo"
    state: absent

- name: Build HTTP Basic auth header for runtime image repo clone
  ansible.builtin.set_fact:
    jekyll_runtime_image_git_basic_auth_header: >-
      AUTHORIZATION: Basic {{
        (jekyll_runtime_image_git_username ~ ':' ~ jekyll_runtime_image_git_password) | b64encode
      }}

- name: Clone seeded Jekyll repo for image build
  ansible.builtin.command:
    cmd: >-
      git
      -c http.extraHeader={{ jekyll_runtime_image_git_basic_auth_header | quote }}
      clone
      --branch {{ jekyll_runtime_image_branch | quote }}
      --single-branch
      https://gitea.lab.brulenet.dev:8443/{{ jekyll_runtime_image_repo_owner }}/{{ jekyll_runtime_image_repo_name }}.git
      {{ jekyll_runtime_image_work_dir }}/repo
  changed_when: true

- name: Initialize Chirpy submodules for image build
  ansible.builtin.command:
    cmd: git submodule update --init --recursive
    chdir: "{{ jekyll_runtime_image_work_dir }}/repo"
  changed_when: true

- name: Build Jekyll runtime image locally
  ansible.builtin.command:
    cmd: podman build --no-cache -t {{ jekyll_runtime_image_name }} .
    chdir: "{{ jekyll_runtime_image_work_dir }}/repo"
  register: jekyll_runtime_image_build
  changed_when: true

- name: Import image into k3s containerd
  ansible.builtin.shell: >-
    podman save {{ jekyll_runtime_image_name }} |
    /usr/local/bin/k3s ctr images import -
  args:
    executable: /bin/bash
  changed_when: true
