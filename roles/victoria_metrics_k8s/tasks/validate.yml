---
- name: Assert VictoriaMetrics namespace is defined
  ansible.builtin.assert:
    that:
      - victoria_metrics_k8s_namespace | length > 0
    fail_msg: "victoria_metrics_k8s_namespace must be defined"

- name: Assert Grafana hostname is defined when Grafana ingress enabled
  ansible.builtin.assert:
    that:
      - not victoria_metrics_k8s_grafana_enabled or (victoria_metrics_k8s_grafana_hostname | length > 0)
    fail_msg: "victoria_metrics_k8s_grafana_hostname must be defined when victoria_metrics_k8s_grafana_enabled is true"

- name: Assert default storage class is defined when persistence enabled
  ansible.builtin.assert:
    that:
      - not victoria_metrics_k8s_persistence_enabled or (victoria_metrics_k8s_default_storage_class | length > 0)
    fail_msg: "victoria_metrics_k8s_default_storage_class must be defined when victoria_metrics_k8s_persistence_enabled is true"
