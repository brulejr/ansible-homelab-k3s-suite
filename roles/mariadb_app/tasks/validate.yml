---
- name: Assert MariaDB namespace is defined
  ansible.builtin.assert:
    that:
      - mariadb_app_namespace | length > 0
    fail_msg: "mariadb_app_namespace must be defined"

- name: Assert MariaDB app name is defined
  ansible.builtin.assert:
    that:
      - mariadb_app_name | length > 0
    fail_msg: "mariadb_app_name must be defined"

- name: Assert MariaDB passwords are defined
  ansible.builtin.assert:
    that:
      - mariadb_app_database_password | length > 0
      - mariadb_app_root_password | length > 0
    fail_msg: "mariadb_app_database_password and mariadb_app_root_password must be defined"

- name: Assert MariaDB storage class is set when persistence enabled
  ansible.builtin.assert:
    that:
      - not mariadb_app_persistence_enabled or (mariadb_app_storage_class | length > 0)
    fail_msg: "mariadb_app_storage_class must be defined when mariadb_app_persistence_enabled is true"
