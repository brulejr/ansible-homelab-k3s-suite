- name: Apply Wavelog deployment manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-deployment.yaml
  changed_when: false

- name: Render Wavelog service manifest
  ansible.builtin.template:
    src: service.yaml.j2
    dest: /tmp/{{ wavelog_app_name }}-service.yaml
    owner: root
    group: root
    mode: "0644"

- name: Apply Wavelog service manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-service.yaml
  changed_when: false

- name: Render Wavelog ingressroute manifest
  ansible.builtin.template:
    src: ingressroute.yaml.j2
    dest: /tmp/{{ wavelog_app_name }}-ingressroute.yaml
    owner: root
    group: root
    mode: "0644"
  when: wavelog_ingress_enabled | bool

- name: Apply Wavelog ingressroute manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-ingressroute.yaml
  changed_when: false
  when: wavelog_ingress_enabled | bool
