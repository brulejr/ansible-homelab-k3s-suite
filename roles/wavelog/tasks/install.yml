---
- name: Render Wavelog namespace manifest
  ansible.builtin.template:
    src: namespace.yaml.j2
    dest: /tmp/{{ wavelog_app_name }}-namespace.yaml
    owner: root
    group: root
    mode: "0644"

- name: Apply Wavelog namespace manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-namespace.yaml
  changed_when: false

- name: Render Wavelog secret manifest
  ansible.builtin.template:
    src: secret.yaml.j2
    dest: /tmp/{{ wavelog_app_name }}-secret.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply Wavelog secret manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-secret.yaml
  changed_when: false

- name: Render Wavelog PVC manifest
  ansible.builtin.template:
    src: pvc.yaml.j2
    dest: /tmp/{{ wavelog_app_name }}-pvc.yaml
    owner: root
    group: root
    mode: "0644"
  when: wavelog_persistence_enabled | bool

- name: Apply Wavelog PVC manifest
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/{{ wavelog_app_name }}-pvc.yaml
  changed_when: false
  when: wavelog_persistence_enabled | bool

- name: Render Wavelog deployment manifest
