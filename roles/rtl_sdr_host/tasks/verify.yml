---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Assert rtl_tcp service exists
  ansible.builtin.assert:
    that:
      - (rtl_sdr_host_service_name ~ '.service') in ansible_facts.services
    fail_msg: "rtl_tcp systemd service was not found"

- name: Capture rtl_tcp service status when not running
  ansible.builtin.command:
    cmd: systemctl status {{ rtl_sdr_host_service_name }} --no-pager -l
  register: rtl_sdr_host_systemctl_status
  changed_when: false
  failed_when: false
  when: ansible_facts.services[rtl_sdr_host_service_name ~ '.service'].state != 'running'

- name: Fail when rtl_tcp service is not running
  ansible.builtin.fail:
    msg: |
      rtl_tcp service is not running.

      systemctl status output:
      {{ rtl_sdr_host_systemctl_status.stdout | default('') }}
      {{ rtl_sdr_host_systemctl_status.stderr | default('') }}
  when: ansible_facts.services[rtl_sdr_host_service_name ~ '.service'].state != 'running'

- name: Wait for rtl_tcp port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ rtl_sdr_host_tcp_port }}"
    timeout: 30

- name: Check rtl_tcp listener
  ansible.builtin.command:
    cmd: ss -ltnp
  register: rtl_sdr_host_ss
  changed_when: false

- name: Assert rtl_tcp is listening on expected port
  ansible.builtin.assert:
    that:
      - "(':' ~ (rtl_sdr_host_tcp_port | string)) in rtl_sdr_host_ss.stdout"
    fail_msg: "rtl_tcp is not listening on the expected port"

- name: Verify RTL-SDR device access
  ansible.builtin.command:
    cmd: /usr/local/bin/rtl_test -t
  register: rtl_sdr_host_rtl_test
  changed_when: false

- name: Assert RTL-SDR test succeeded
  ansible.builtin.assert:
    that:
      - rtl_sdr_host_rtl_test.rc == 0
    fail_msg: |
      rtl_test failed.

      stdout:
      {{ rtl_sdr_host_rtl_test.stdout | default('') }}

      stderr:
      {{ rtl_sdr_host_rtl_test.stderr | default('') }}
