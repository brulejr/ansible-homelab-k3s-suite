---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Assert K3S service exists
  ansible.builtin.assert:
    that:
      - k3s_server_service_name ~ '.service' in ansible_facts.services
    fail_msg: "K3S systemd service was not found"

- name: Assert K3S service is running
  ansible.builtin.assert:
    that:
      - ansible_facts.services[k3s_server_service_name ~ '.service'].state == 'running'
    fail_msg: "K3S service is not running"

- name: Wait for Kubernetes API port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 6443
    timeout: 60

- name: Verify kubectl can reach the cluster
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_server_nodes
  changed_when: false
