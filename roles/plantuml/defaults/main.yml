---
plantuml_enabled: true

# Identity
plantuml_namespace: apps
plantuml_app_name: plantuml
plantuml_hostname: plantuml.lab.example.com

# Image/runtime
plantuml_image: plantuml/plantuml-server:jetty
plantuml_replicas: 1
plantuml_container_port: 8080
plantuml_service_port: 8080

# Exposure
plantuml_ingress_enabled: true
plantuml_ingress_class_name: traefik
plantuml_ingress_middlewares: []
plantuml_tls_enabled: true
plantuml_tls_cert_resolver: le

# Persistence
plantuml_persistence_enabled: false
plantuml_storage_class: ""
plantuml_storage_size: 1Gi
