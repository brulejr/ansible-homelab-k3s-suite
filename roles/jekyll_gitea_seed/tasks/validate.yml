---
- name: Assert Jekyll bootstrap admin username is defined
  ansible.builtin.assert:
    that:
      - jekyll_gitea_seed_bootstrap_admin_username | length > 0
    fail_msg: "jekyll_gitea_seed_bootstrap_admin_username must be defined"

- name: Assert Jekyll bootstrap admin email is defined
  ansible.builtin.assert:
    that:
      - jekyll_gitea_seed_bootstrap_admin_email | length > 0
    fail_msg: "jekyll_gitea_seed_bootstrap_admin_email must be defined"

- name: Assert Jekyll bootstrap admin password is defined
  ansible.builtin.assert:
    that:
      - jekyll_gitea_seed_bootstrap_admin_password | length > 0
    fail_msg: "jekyll_gitea_seed_bootstrap_admin_password must be defined"

