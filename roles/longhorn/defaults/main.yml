---
longhorn_enabled: true

# Release
longhorn_namespace: longhorn-system
longhorn_release_name: longhorn
longhorn_chart_name: longhorn
longhorn_chart_repo_name: longhorn
longhorn_chart_repo_url: https://charts.longhorn.io
longhorn_chart_version: ""

# Runtime
longhorn_values_file: /tmp/longhorn-values.yaml
longhorn_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# UI exposure
longhorn_ui_enabled: true
longhorn_ui_hostname: ""
longhorn_ingress_class_name: traefik
longhorn_ui_middlewares: []
longhorn_tls_enabled: true
longhorn_tls_cert_resolver: le

# Storage class / settings
longhorn_default_storage_class: true
longhorn_storage_class_name: longhorn
longhorn_default_settings: {}

# Helm install
longhorn_helm_binary_path: /usr/local/bin/helm

# Host prerequisites
longhorn_prerequisite_packages:
  - open-iscsi
  - nfs-utils
  - tar
