---
traefik_enabled: true

# Release
traefik_namespace: traefik
traefik_release_name: traefik
traefik_chart_name: traefik
traefik_chart_repo_name: traefik
traefik_chart_repo_url: https://traefik.github.io/charts
traefik_chart_version: ""
traefik_create_namespace: true

# Service and ingress
traefik_ingress_class_name: traefik
traefik_service_type: LoadBalancer

# Dashboard
traefik_dashboard_enabled: false
traefik_dashboard_hostname: ""

# ACME / TLS
traefik_acme_enabled: true
traefik_acme_resolver_name: le
traefik_acme_email: ""
traefik_acme_ca_server: https://acme-v02.api.letsencrypt.org/directory
traefik_acme_storage_path: /data/acme.json

# ACME DNS challenge
traefik_acme_dns_challenge_enabled: true
traefik_acme_dns_provider: cloudflare
traefik_acme_dns_delay_before_check: 0
traefik_acme_dns_resolvers: []

# Cloudflare credential injection
traefik_cloudflare_secret_name: traefik-cloudflare-api
traefik_cloudflare_secret_key: api-token
traefik_cloudflare_dns_api_token: ""

# Runtime
traefik_values_file: /tmp/traefik-values.yaml
traefik_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Helm install
traefik_helm_version: v3.18.0
traefik_helm_platform: linux-amd64
traefik_helm_archive: "helm-{{ traefik_helm_version }}-{{ traefik_helm_platform }}.tar.gz"
traefik_helm_download_url: "https://get.helm.sh/{{ traefik_helm_archive }}"
traefik_helm_download_path: "/tmp/{{ traefik_helm_archive }}"
traefik_helm_extract_path: /tmp
traefik_helm_binary_path: /usr/local/bin/helm

# Host prerequisites
traefik_prerequisite_packages:
  - tar
