---
- name: Assert Traefik namespace is defined
  ansible.builtin.assert:
    that:
      - traefik_namespace | length > 0
    fail_msg: "traefik_namespace must be defined"

- name: Assert Traefik ACME email is defined when ACME enabled
  ansible.builtin.assert:
    that:
      - not traefik_acme_enabled or (traefik_acme_email | length > 0)
    fail_msg: "traefik_acme_email must be defined when traefik_acme_enabled is true"

- name: Assert dashboard hostname is defined when dashboard enabled
  ansible.builtin.assert:
    that:
      - not traefik_dashboard_enabled or (traefik_dashboard_hostname | length > 0)
    fail_msg: "traefik_dashboard_hostname must be defined when traefik_dashboard_enabled is true"

- name: Assert ACME resolver name is defined when ACME enabled
  ansible.builtin.assert:
    that:
      - not traefik_acme_enabled or (traefik_acme_resolver_name | length > 0)
    fail_msg: "traefik_acme_resolver_name must be defined when traefik_acme_enabled is true"

- name: Assert ACME DNS provider is defined when DNS challenge enabled
  ansible.builtin.assert:
    that:
      - not traefik_acme_dns_challenge_enabled or (traefik_acme_dns_provider | length > 0)
    fail_msg: "traefik_acme_dns_provider must be defined when traefik_acme_dns_challenge_enabled is true"

- name: Assert Cloudflare token is defined when using Cloudflare DNS challenge
  ansible.builtin.assert:
    that:
      - not (traefik_acme_dns_challenge_enabled and traefik_acme_dns_provider == 'cloudflare') or (traefik_cloudflare_dns_api_token | length > 0)
    fail_msg: "traefik_cloudflare_dns_api_token must be defined when using Cloudflare DNS challenge"
