---
- name: Install Traefik prerequisite packages
  ansible.builtin.package:
    name: "{{ traefik_prerequisite_packages }}"
    state: present

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "{{ traefik_helm_download_url }}"
    dest: "{{ traefik_helm_download_path }}"
    mode: "0644"

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "{{ traefik_helm_download_path }}"
    dest: "{{ traefik_helm_extract_path }}"
    remote_src: true
    creates: "{{ traefik_helm_extract_path }}/{{ traefik_helm_platform }}/helm"

- name: Install Helm binary
  ansible.builtin.copy:
    src: "{{ traefik_helm_extract_path }}/{{ traefik_helm_platform }}/helm"
    dest: "{{ traefik_helm_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Ensure Traefik namespace exists
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl create namespace {{ traefik_namespace }}
  register: traefik_namespace_create
  changed_when: "'created' in traefik_namespace_create.stdout"
  failed_when:
    - traefik_namespace_create.rc != 0
    - "'AlreadyExists' not in traefik_namespace_create.stderr"

- name: Render Traefik Cloudflare secret manifest
  ansible.builtin.template:
    src: cloudflare-secret.yaml.j2
    dest: /tmp/traefik-cloudflare-secret.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - traefik_acme_enabled | bool
    - traefik_acme_dns_challenge_enabled | bool
    - traefik_acme_dns_provider == 'cloudflare'

- name: Apply Traefik Cloudflare secret
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/traefik-cloudflare-secret.yaml
  when:
    - traefik_acme_enabled | bool
    - traefik_acme_dns_challenge_enabled | bool
    - traefik_acme_dns_provider == 'cloudflare'
  changed_when: false

- name: Render Traefik Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ traefik_values_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install or upgrade Traefik via Helm
  ansible.builtin.shell: |
    set -o errexit
    set -o nounset
    set -o pipefail
    {{ traefik_helm_binary_path }} --kubeconfig {{ traefik_kubeconfig_path }} repo add {{ traefik_chart_repo_name }} {{ traefik_chart_repo_url }}
    {{ traefik_helm_binary_path }} --kubeconfig {{ traefik_kubeconfig_path }} repo update
    {{ traefik_helm_binary_path }} --kubeconfig {{ traefik_kubeconfig_path }} upgrade --install {{ traefik_release_name }} {{ traefik_chart_repo_name }}/{{ traefik_chart_name }} \
      --namespace {{ traefik_namespace }} \
      --create-namespace \
      {% if traefik_chart_version | length > 0 %}--version {{ traefik_chart_version }} \{% endif %}
      -f {{ traefik_values_file }}
  args:
    executable: /bin/bash

- name: Render Traefik dashboard IngressRoute
  ansible.builtin.template:
    src: dashboard-ingressroute.yaml.j2
    dest: /tmp/traefik-dashboard-ingressroute.yaml
    owner: root
    group: root
    mode: "0644"
  when: traefik_dashboard_enabled | bool

- name: Apply Traefik dashboard IngressRoute
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply -f /tmp/traefik-dashboard-ingressroute.yaml
  when: traefik_dashboard_enabled | bool
  changed_when: false
