---
- name: Wait for Traefik deployment rollout
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl -n {{ traefik_namespace }} rollout status deploy/{{ traefik_release_name }} --timeout=120s
  changed_when: false

- name: Get Traefik pods
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl -n {{ traefik_namespace }} get pods -o wide
  register: traefik_pods
  changed_when: false
