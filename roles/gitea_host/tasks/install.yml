---
- name: Install Gitea prerequisite packages
  ansible.builtin.package:
    name: "{{ gitea_host_prerequisite_packages }}"
    state: present

- name: Ensure Gitea group exists
  ansible.builtin.group:
    name: "{{ gitea_host_group }}"
    state: present

- name: Ensure Gitea user exists
  ansible.builtin.user:
    name: "{{ gitea_host_user }}"
    group: "{{ gitea_host_group }}"
    home: "{{ gitea_host_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Ensure Gitea directories exist
  ansible.builtin.file:
    path: "{{ gitea_dir.path }}"
    state: directory
    owner: "{{ gitea_dir.owner | default(gitea_host_user) }}"
    group: "{{ gitea_dir.group | default(gitea_host_group) }}"
    mode: "{{ gitea_dir.mode }}"
  loop:
    - {
        path: "{{ gitea_host_install_dir }}",
        mode: "0755",
        owner: "root",
        group: "root",
      }
    - { path: "{{ gitea_host_data_dir }}", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/custom", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/repositories", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/tmp", mode: "0755" }
    - {
        path: "{{ gitea_host_config_dir }}",
        mode: "0750",
        owner: "root",
        group: "{{ gitea_host_group }}",
      }
    - { path: "{{ gitea_host_log_dir }}", mode: "0755" }
    - { path: "/etc/letsencrypt", mode: "0755", owner: "root", group: "root" }
  loop_control:
    loop_var: gitea_dir

- name: Download Gitea binary
  ansible.builtin.get_url:
    url: "{{ gitea_host_download_url }}"
    dest: "{{ gitea_host_binary_path }}"
    mode: "0755"
    owner: root
    group: root

- name: Render Gitea app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ gitea_host_config_dir }}/app.ini"
    owner: "{{ gitea_host_user }}"
    group: "{{ gitea_host_group }}"
    mode: "0640"
  notify: Restart gitea

- name: Render Gitea systemd unit
  ansible.builtin.template:
    src: gitea.service.j2
    dest: "/etc/systemd/system/{{ gitea_host_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart gitea

- name: Ensure Gitea service is enabled and started
  ansible.builtin.systemd:
    name: "{{ gitea_host_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Render Cloudflare credentials file for Certbot
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: "{{ gitea_host_certbot_cloudflare_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - gitea_host_nginx_enabled | bool
    - gitea_host_tls_enabled | bool

- name: Render Nginx site for Gitea
  ansible.builtin.template:
    src: nginx-gitea.conf.j2
    dest: "/etc/nginx/sites-available/{{ gitea_host_nginx_site_name }}"
    owner: root
    group: root
    mode: "0644"
  when: gitea_host_nginx_enabled | bool
  notify: Reload nginx

- name: Enable Nginx site for Gitea
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ gitea_host_nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ gitea_host_nginx_site_name }}"
    state: link
  when: gitea_host_nginx_enabled | bool
  notify: Reload nginx

- name: Disable default Nginx site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: gitea_host_nginx_enabled | bool
  notify: Reload nginx

- name: Ensure Nginx service is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: gitea_host_nginx_enabled | bool

- name: Obtain or renew Gitea TLS certificate with Certbot Cloudflare DNS plugin
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --non-interactive
      --agree-tos
      --dns-cloudflare
      --dns-cloudflare-credentials {{ gitea_host_certbot_cloudflare_credentials_path }}
      --dns-cloudflare-propagation-seconds {{ gitea_host_certbot_dns_propagation_seconds }}
      --email {{ gitea_host_certbot_email }}
      --cert-name {{ gitea_host_domain }}
      --domain {{ gitea_host_domain }}
      --key-type {{ gitea_host_certbot_key_type }}
      --keep-until-expiring
      --deploy-hook "systemctl reload nginx"
  when:
    - gitea_host_nginx_enabled | bool
    - gitea_host_tls_enabled | bool
  register: gitea_host_certbot_result
  changed_when: >
    'Successfully received certificate' in (gitea_host_certbot_result.stdout | default('')) or
    'Certificate not yet due for renewal' not in (gitea_host_certbot_result.stdout | default(''))

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: gitea_host_nginx_enabled | bool

- name: Ensure Certbot renewal timer is enabled and started
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
  when:
    - gitea_host_nginx_enabled | bool
    - gitea_host_tls_enabled | bool
