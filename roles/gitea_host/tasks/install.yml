---
- name: Install Gitea prerequisite packages
  ansible.builtin.package:
    name: "{{ gitea_host_prerequisite_packages }}"
    state: present

- name: Ensure Gitea group exists
  ansible.builtin.group:
    name: "{{ gitea_host_group }}"
    state: present

- name: Ensure Gitea user exists
  ansible.builtin.user:
    name: "{{ gitea_host_user }}"
    group: "{{ gitea_host_group }}"
    home: "{{ gitea_host_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Ensure Gitea directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(gitea_host_user) }}"
    group: "{{ item.group | default(gitea_host_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - {
        path: "{{ gitea_host_install_dir }}",
        mode: "0755",
        owner: "root",
        group: "root",
      }
    - { path: "{{ gitea_host_data_dir }}", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/custom", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/repositories", mode: "0755" }
    - { path: "{{ gitea_host_data_dir }}/tmp", mode: "0755" }
    - { path: "{{ gitea_host_config_dir }}", mode: "0750" }
    - { path: "{{ gitea_host_log_dir }}", mode: "0755" }

- name: Download Gitea binary
  ansible.builtin.get_url:
    url: "{{ gitea_host_download_url }}"
    dest: "{{ gitea_host_binary_path }}"
    mode: "0755"
    owner: root
    group: root

- name: Render Gitea app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ gitea_host_config_dir }}/app.ini"
    owner: root
    group: "{{ gitea_host_group }}"
    mode: "0640"
  notify: Restart gitea

- name: Render Gitea systemd unit
  ansible.builtin.template:
    src: gitea.service.j2
    dest: "/etc/systemd/system/{{ gitea_host_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart gitea

- name: Ensure Gitea service is enabled and started
  ansible.builtin.systemd:
    name: "{{ gitea_host_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
