---
- name: Cluster applications
  hosts: k3s_servers
  become: true
  tasks:
    - name: Assert cluster app manifest is defined
      ansible.builtin.assert:
        that:
          - cluster_app_roles is defined
          - cluster_app_roles is iterable
        fail_msg: "cluster_app_roles must be defined by the inventory"

    - name: Assert cluster app manifest entries are valid role names
      ansible.builtin.assert:
        that:
          - item is string
          - item | trim | length > 0
        fail_msg: "Each cluster_app_roles entry must be a non-empty role name"
      loop: "{{ cluster_app_roles }}"

    - name: Assert cluster app manifest has no duplicates
      ansible.builtin.assert:
        that:
          - cluster_app_roles | unique | length == cluster_app_roles | length
        fail_msg: "cluster_app_roles contains duplicate entries"

    - name: Include cluster application roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ cluster_app_roles }}"
